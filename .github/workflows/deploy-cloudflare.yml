name: Verify Cloudflare cloud pack

# Production deploy is handled by Cloudflare Workers Builds (Git integration).
# This workflow only verifies the cloud pack still builds on main.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build cloud pack (thumbs, no full heros)
        run: npm run build:cloud

      - name: Confirm dist-cloud assets
        run: |
          test -d dist-cloud
          test -f dist-cloud/index.html
          test ! -d dist-cloud/garage/heros
          echo "dist-cloud ready ($(du -sh dist-cloud | cut -f1))"
