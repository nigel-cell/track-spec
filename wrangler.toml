name = "track-spec"
compatibility_date = "2026-08-01"

# Phone / Cloudflare build — use dist-cloud (thumbs, no full heros)
# Local Live + desktop exe still use full `dist/` via server.js / Electron
[assets]
directory = "./dist-cloud"
not_found_handling = "single-page-application"
run_worker_first = false
